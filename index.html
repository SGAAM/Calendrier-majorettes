<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9d1020">
<title>Calendrier Golden Stars</title>
<style>
:root{--red:#9d1020;--red2:#c51b31;--gold:#d7a72b;--gold2:#f2d06b;--cream:#fffaf0;--ink:#24232a;--muted:#706d75;--line:#eadfca;--shadow:0 8px 30px #4b1b250d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff8ed 0,#fff 420px);color:var(--ink)}
header{background:linear-gradient(135deg,#730817,#b91328);color:#fff;border-bottom:5px solid var(--gold);padding:18px 16px 20px}.brand{max-width:1050px;margin:auto;display:flex;align-items:center;gap:15px}.logo{width:78px;height:88px;flex:none;filter:drop-shadow(0 4px 5px #0004)}h1{margin:0;font-size:26px;letter-spacing:-.02em}.sub{margin-top:5px;color:#ffe9a0;font-weight:650}
main{max-width:1050px;margin:auto;padding:18px 14px 35px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:13px}.filters{display:flex;gap:8px;flex:1}.filters select{max-width:300px}button,select,input,textarea{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-weight:750;background:#fff;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;width:100%}
.calendar{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.calbar{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:linear-gradient(90deg,#fff6dd,#fff);border-bottom:2px solid var(--gold)}.month{font-size:21px;font-weight:850;color:var(--red);text-transform:capitalize}.nav{display:flex;gap:6px}.nav .btn{padding:8px 11px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;padding:9px 3px;background:#fff9ed;color:#876000;font-size:11px;font-weight:850;text-transform:uppercase;border-bottom:1px solid var(--line)}.day{min-height:118px;padding:6px;border-right:1px solid #f0e5d1;border-bottom:1px solid #f0e5d1;background:#fff;position:relative}.day:nth-child(7n){border-right:0}.day.other{background:#fbf9f5;color:#b9b0a0}.day.today{background:#fff6f6;box-shadow:inset 0 0 0 2px #d52a3b}.num{font-weight:850;font-size:13px;color:#68636a;margin-bottom:5px}.today .num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center}
.event{width:100%;display:block;text-align:left;border:0;border-left:4px solid var(--red);border-radius:8px;background:#fff0f2;color:#65121d;padding:6px;margin:4px 0;font-size:11px;font-weight:750;overflow:hidden}.event.gold{border-left-color:var(--gold);background:#fff8df;color:#765300}.event.green{border-left-color:#3b8b62;background:#effaf4;color:#246044}.event.blue{border-left-color:#4b70b8;background:#eef4ff;color:#31558f}.event .time{font-size:10px;opacity:.8}.more{font-size:10px;color:#8a6500;font-weight:800;padding:2px 5px}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);background:#fffdf8;font-size:11px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;background:var(--red)}.dot.gold{background:var(--gold)}.dot.green{background:#3b8b62}.dot.blue{background:#4b70b8}
dialog{border:0;border-radius:20px;width:min(94%,560px);padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0008}.form{padding:20px}.form h2{margin:0 0 12px;color:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.outfits{display:grid;gap:7px}.outfit{display:block;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fffaf0}.outfit input{width:auto;margin-right:7px}.custom{display:none;margin-top:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.detail{padding:20px}.detail h2{margin:0 0 10px;color:var(--red)}.info{padding:9px 0;border-bottom:1px solid var(--line)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{padding:5px 9px;border-radius:99px;background:#fff1d0;border:1px solid #e3c777;color:#805c00;font-size:12px;font-weight:750}
@media(max-width:650px){header{padding:14px 12px 16px}.logo{width:62px;height:72px}h1{font-size:21px}.sub{font-size:12px}.filters{min-width:100%}.filters select{max-width:none}.day{min-height:86px;padding:4px}.event{font-size:10px;padding:5px 4px;border-left-width:3px}.event .time{font-size:9px}.weekday{font-size:9px;padding:7px 1px}.month{font-size:18px}.calbar{padding:10px 8px}.nav .btn{padding:7px 9px}.legend{font-size:10px}}
</style>
</head>
<body>
<header>
<div class="brand">
<svg class="logo" viewBox="0 0 120 140" aria-label="Golden Stars Majorette Club" role="img">
<path d="M60 3 112 20v57c0 28-21 48-52 60C29 125 8 105 8 77V20Z" fill="#b80f22" stroke="#e0b12f" stroke-width="5"/>
<path d="M45 43c8-10 21-11 29-3l-4 7c-7-4-13-2-16 3 5 2 9 7 9 13 0 5-3 10-7 13 4 2 9 4 14 4 7 0 13-4 17-10l5 4c-5 11-14 17-25 18-7 1-12-1-17-4l-4 27h-8l3-34c-6-4-10-10-10-17 0-8 5-16 14-21Z" fill="#e0b12f"/>
<path d="M44 41 72 20" stroke="#e0b12f" stroke-width="3"/><path d="M71 20l-2-8m2 8 8-3" stroke="#e0b12f" stroke-width="3"/>
<circle cx="44" cy="41" r="4" fill="#e0b12f"/><circle cx="83" cy="28" r="4" fill="#e0b12f"/>
<path d="M3 82h114v25H3z" fill="#9d1020" stroke="#e0b12f" stroke-width="3"/>
<text x="60" y="98" text-anchor="middle" font-size="11" font-weight="900" fill="#e0b12f" font-family="Arial">GOLDEN STARS</text>
<text x="60" y="117" text-anchor="middle" font-size="7" font-weight="900" fill="#e0b12f" font-family="Arial">MAJORETTE CLUB</text>
</svg>
<div><h1>Calendrier des Majorettes</h1><div class="sub">Golden Stars Majorette Club</div></div>
</div>
</header>
<main>
<div class="toolbar">
<div class="filters"><select id="type"><option value="all">Tous les événements</option><option>Défilé</option><option>Festival</option><option>Entraînement</option><option>Réunion</option><option>Forum</option><option>Autre</option></select></div>
<button class="btn red" id="add">＋ Ajouter</button><button class="btn" id="ics">📅 Exporter</button>
</div>
<section class="calendar">
<div class="calbar"><div class="nav"><button class="btn" id="prev">‹</button><button class="btn" id="today">Aujourd'hui</button><button class="btn" id="next">›</button></div><div class="month" id="calTitle"></div><div style="width:1px"></div></div>
<div class="weekdays"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mer</div><div class="weekday">Jeu</div><div class="weekday">Ven</div><div class="weekday">Sam</div><div class="weekday">Dim</div></div>
<div class="days" id="events"></div>
<div class="legend"><span><i class="dot"></i>Défilé / Autre</span><span><i class="dot gold"></i>Festival</span><span><i class="dot green"></i>Entraînement</span><span><i class="dot blue"></i>Réunion / Forum</span></div>
</section>
</main>
<dialog id="dlg"><form method="dialog" class="form" id="form">
<h2>Ajouter un événement</h2>
<div class="field"><label>Nom de l'événement</label><input id="title" required placeholder="Ex. Festival de Villeneuve"></div>
<div class="row"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Heure</label><input id="time" type="time"></div></div>
<div class="field"><label>Lieu</label><input id="place" placeholder="Ex. Parc des expositions"></div>
<div class="field"><label>Type</label><select id="kind"><option>Défilé</option><option>Festival</option><option>Entraînement</option><option>Réunion</option><option>Forum</option><option>Autre</option></select></div>
<div class="field"><label>Tenue — plusieurs choix possibles</label><div class="outfits">
<label class="outfit"><input type="checkbox" name="outfit" value="Justaucorps rouge et doré">Justaucorps rouge et doré</label>
<label class="outfit"><input type="checkbox" name="outfit" value="Robes à paillettes">Robes à paillettes</label>
<label class="outfit"><input type="checkbox" name="outfit" value="Bottes">Bottes</label>
<label class="outfit"><input type="checkbox" name="outfit" value="Converses blanches">Converses blanches</label>
<label class="outfit"><input type="checkbox" id="specialOutfit" name="outfit" value="Tenue spéciale">Tenue spéciale</label>
<input class="custom" id="customOutfit" placeholder="Précise la tenue spéciale…">
</div></div>
<div class="field"><label>Informations</label><textarea id="notes" rows="3" placeholder="Rendez-vous, matériel, consignes…"></textarea></div>
<div class="actions"><button class="btn" value="cancel">Annuler</button><button class="btn red" id="save" value="default">Enregistrer</button></div>
</form></dialog>
<dialog id="detail"></dialog>
<script>
const KEY='majorettes-events-v1';
let events=JSON.parse(localStorage.getItem(KEY)||'[]').map((e,i)=>({...e,id:e.id||String(i)}));
const $=id=>document.getElementById(id);let view=new Date();view.setDate(1);
const fmt=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00'));
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function cls(kind){return kind==='Festival'?'gold':kind==='Entraînement'?'green':(kind==='Réunion'||kind==='Forum')?'blue':''}
function render(){
 const type=$('type').value,y=view.getFullYear(),m=view.getMonth();$('calTitle').textContent=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(view);
 const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),todayKey=new Date().toISOString().slice(0,10);let cells='';
 for(let i=0;i<42;i++){const n=i-start+1;let yy=y,mm=m,d=n,other=false;if(n<1){d=prevDays+n;mm=m-1;other=true;if(mm<0){mm=11;yy--;}}else if(n>days){d=n-days;mm=m+1;other=true;if(mm>11){mm=0;yy++;}}
  const key=iso(yy,mm,d),list=events.filter(e=>e.date===key&&(type==='all'||e.kind===type)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));cells+='<div class="day '+(other?'other ':'')+(key===todayKey?'today':'')+'"><div class="num">'+d+'</div>'+list.slice(0,3).map(e=>'<button class="event '+cls(e.kind)+'" data-id="'+esc(e.id)+'"><span class="time">'+(e.time?esc(e.time)+' · ':'')+'</span>'+esc(e.title)+'</button>').join('')+(list.length>3?'<div class="more">+'+(list.length-3)+' autre(s)</div>':'')+'</div>';
 }$('events').innerHTML=cells;document.querySelectorAll('.event').forEach(b=>b.onclick=()=>showEvent(b.dataset.id));
}
function showEvent(id){const e=events.find(x=>x.id===id);if(!e)return;const os=Array.isArray(e.outfit)?e.outfit:(e.outfit?[e.outfit]:[]);$('detail').innerHTML='<div class="detail"><h2>'+esc(e.title)+'</h2><div class="info">📅 '+fmt(e.date)+'</div>'+(e.time?'<div class="info">🕒 '+esc(e.time)+'</div>':'')+(e.place?'<div class="info">📍 '+esc(e.place)+'</div>':'')+'<div class="info">🏷️ '+esc(e.kind)+'</div>'+(os.length?'<div class="info"><strong>Tenue</strong><div class="badges">'+os.map(o=>'<span class="badge">👗 '+esc(o)+'</span>').join('')+'</div></div>':'')+(e.notes?'<div class="info">📝 '+esc(e.notes)+'</div>':'')+'<div class="actions"><button class="btn" onclick="detail.close()">Fermer</button></div></div>';$('detail').showModal();}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date();view.setDate(1);render()};$('type').onchange=render;
$('add').onclick=()=>{$('form').reset();document.querySelectorAll('input[name="outfit"]').forEach(x=>x.checked=false);$('customOutfit').style.display='none';$('dlg').showModal()};
$('specialOutfit').onchange=()=>{$('customOutfit').style.display=$('specialOutfit').checked?'block':'none'};
$('form').onsubmit=e=>{e.preventDefault();let os=[...document.querySelectorAll('input[name="outfit"]:checked')].map(x=>x.value),custom=$('customOutfit').value.trim();if($('specialOutfit').checked&&custom){os=os.filter(x=>x!=='Tenue spéciale');os.push(custom)}events.push({id:crypto.randomUUID(),title:$('title').value,date:$('date').value,time:$('time').value,place:$('place').value,kind:$('kind').value,outfit:os,notes:$('notes').value});localStorage.setItem(KEY,JSON.stringify(events));render();$('dlg').close()};
$('ics').onclick=()=>{if(!events.length)return alert('Aucun événement à exporter.');const escics=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const body=events.map(e=>{let dt=e.date.replace(/-/g,'')+(e.time?'T'+e.time.replace(':','')+'00':'T120000');return 'BEGIN:VEVENT\\r\\nDTSTART:'+dt+'\\r\\nSUMMARY:'+escics(e.title)+'\\r\\nLOCATION:'+escics(e.place)+'\\r\\nDESCRIPTION:'+escics(e.notes)+'\\r\\nEND:VEVENT'}).join('\\r\\n');const blob=new Blob(['BEGIN:VCALENDAR\\r\\nVERSION:2.0\\r\\nPRODID:-//Golden Stars//FR\\r\\n'+body+'\\r\\nEND:VCALENDAR'],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calendrier-golden-stars.ics';a.click()};
render();
</script>
</body></html>
