<title>Calendrier des Majorettes</title>
<style>
:root{--p:#b20d1d;--gold:#c9972b;--bg:#fffaf2;--card:#fff;--text:#202331;--muted:#687080;--line:#ead9b4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#7d0714,#b20d1d);border-bottom:4px solid var(--gold);color:#fff;padding:18px 16px 16px;border-radius:0 0 22px 22px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:74px;height:88px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 3px 5px #0005)}h1{margin:0;font-size:25px}.sub{margin-top:5px;opacity:.9}main{max-width:920px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;cursor:pointer}.primary{background:var(--p);color:#fff}.gold{background:var(--gold);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.filters{display:flex;gap:10px;flex:1;min-width:260px}.filters select{flex:1}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 16px #1b20400b}.cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(90deg,#fff7e8,#fff);border-bottom:2px solid var(--gold)}.cal-title{font-size:21px;font-weight:800;color:var(--p);text-transform:capitalize}.cal-nav{display:flex;gap:6px}.cal-nav button{padding:8px 11px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;padding:10px 3px;font-size:12px;font-weight:800;color:#8a5b00;background:#fffaf2;border-bottom:1px solid var(--line);text-transform:uppercase}.day{min-height:108px;border-right:1px solid #f0e3c9;border-bottom:1px solid #f0e3c9;padding:6px;position:relative;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#fbf8f2;color:#b5a98f}.day.today{background:#fff4f4;box-shadow:inset 0 0 0 2px #d51b2d}.day-number{font-weight:800;font-size:13px;color:#6b6570;margin-bottom:4px}.today .day-number{display:inline-flex;background:var(--p);color:#fff;border-radius:50%;width:26px;height:26px;align-items:center;justify-content:center}.event-pill{display:block;width:100%;border:0;text-align:left;margin:4px 0;padding:5px 6px;border-radius:7px;background:#fff0f0;border-left:4px solid var(--p);color:#5f1119;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event-pill:nth-child(3n){background:#fff7df;border-left-color:var(--gold);color:#755000}.event-pill:active{transform:scale(.99)}.more{font-size:10px;color:#8a5b00;font-weight:700;padding-left:5px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.detail{padding:20px}.detail h2{margin-top:0;color:var(--p)}.detail .info{padding:9px 0;border-bottom:1px solid var(--line)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff1d1;color:#8a5b00;border:1px solid #e4c77f;font-size:12px;font-weight:700}dialog{border:0;border-radius:20px;width:min(94%,560px);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.form{padding:20px}.form h2{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.outfit-options{display:grid;gap:7px}.outfit-option{display:block;background:#fffaf2;border:1px solid var(--line);border-radius:9px;padding:8px}.outfit-option input{width:auto;margin-right:7px}.custom-outfit{display:none;margin-top:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:650px){.filters{min-width:100%}.filters select{min-width:0}.day{min-height:88px;padding:4px}.event-pill{font-size:10px;padding:4px;border-left-width:3px}.cal-title{font-size:18px}.weekday{font-size:10px;padding:8px 1px}.brand-logo{width:58px;height:70px}h1{font-size:21px}}
</head>

<main><div class="toolbar"><div class="filters"><select id="type"><option value="all">Tous les événements</option><option>Défilé</option><option>Festival</option><option>Entraînement</option><option>Réunion</option><option>Forum</option><option>Autre</option></select></div><button class="primary" id="add">＋ Ajouter</button><button class="secondary" id="ics">📅 Exporter</button></div><section class="calendar"><div class="cal-head"><div class="cal-nav"><button class="secondary" id="prev">‹</button><button class="secondary" id="today">Aujourd'hui</button><button class="secondary" id="next">›</button></div><div class="cal-title" id="calTitle"></div><div style="width:36px"></div></div><div class="weekdays"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mer</div><div class="weekday">Jeu</div><div class="weekday">Ven</div><div class="weekday">Sam</div><div class="weekday">Dim</div></div><div class="days" id="events"></div></section></main>

<dialog id="dlg">
<form method="dialog" class="form" id="form">
<h2>Ajouter un événement</h2>
<div class="field"><label>Nom de l'événement</label><input id="title" required placeholder="Ex. Festival de Villeneuve"></div>
<div class="row">
<div class="field"><label>Date</label><input id="date" type="date" required></div>
<div class="field"><label>Heure</label><input id="time" type="time"></div>
</div>
<div class="field"><label>Lieu</label><input id="place" placeholder="Ex. Parc des expositions"></div>
<div class="field"><label>Type</label><select id="kind"><option>Défilé</option><option>Festival</option><option>Entraînement</option><option>Réunion</option><option>Forum</option><option>Autre</option></select></div>
<div class="field"><label>Tenue — plusieurs choix possibles</label><div class="outfit-options"><label class="outfit-option"><input type="checkbox" name="outfit" value="Justaucorps rouge et doré"> Justaucorps rouge et doré</label><label class="outfit-option"><input type="checkbox" name="outfit" value="Robe à paillettes"> Robe à paillettes</label><label class="outfit-option"><input type="checkbox" name="outfit" value="Bottes"> Bottes</label><label class="outfit-option"><input type="checkbox" name="outfit" value="Converses blanches"> Converses blanches</label><label class="outfit-option"><input type="checkbox" id="specialOutfit" name="outfit" value="Tenue spéciale"> Tenue spéciale</label><input class="custom-outfit" id="customOutfit" placeholder="Précise la tenue spéciale…"></div></div>
<div class="field"><label>Informations</label><textarea id="notes" rows="3" placeholder="Rendez-vous, tenue, matériel..."></textarea></div>
<div class="actions"><button class="secondary" value="cancel">Annuler</button><button class="primary" id="save" value="default">Enregistrer</button></div>
</form>
</dialog>

<script>
const KEY='majorettes-events-v1';
let events=JSON.parse(localStorage.getItem(KEY)||'[]').map((e,i)=>({...e,id:e.id||String(i)}));
const $=id=>document.getElementById(id);
let view=new Date(); view.setDate(1);
const fmt=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00'));
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function render(){
 const type=$('type').value,y=view.getFullYear(),m=view.getMonth();
 $('calTitle').textContent=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(view);
 const first=new Date(y,m,1), start=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
 let cells='';
 for(let i=0;i<42;i++){
  const n=i-start+1; let yy=y,mm=m,d=n,other=false;
  if(n<1){d=prevDays+n;mm=m-1;other=true;if(mm<0){mm=11;yy--;}}
  else if(n>days){d=n-days;mm=m+1;other=true;if(mm>11){mm=0;yy++;}}
  const key=iso(yy,mm,d);
  const list=events.filter(e=>e.date===key&&(type==='all'||e.kind===type)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const todayKey=new Date().toISOString().slice(0,10);
  cells+='<div class="day '+(other?'other ':'')+(key===todayKey?'today':'')+'"><div class="day-number">'+d+'</div>'+list.slice(0,3).map(e=>'<button class="event-pill" data-id="'+esc(e.id)+'">'+(e.time?esc(e.time)+' • ':'')+esc(e.title)+'</button>').join('')+(list.length>3?'<div class="more">+'+(list.length-3)+' autre(s)</div>':'')+'</div>';
 }
 $('events').innerHTML=cells;
 document.querySelectorAll('.event-pill').forEach(b=>b.onclick=()=>showEvent(b.dataset.id));
}
function showEvent(id){
 const e=events.find(x=>x.id===id); if(!e)return;
 const outfits=Array.isArray(e.outfit)?e.outfit:(e.outfit?[e.outfit]:[]);
 $('detail').innerHTML='<div class="detail"><h2>'+esc(e.title)+'</h2><div class="info">📅 '+fmt(e.date)+'</div>'+(e.time?'<div class="info">🕒 '+esc(e.time)+'</div>':'')+(e.place?'<div class="info">📍 '+esc(e.place)+'</div>':'')+'<div class="info">🏷️ '+esc(e.kind)+'</div>'+(outfits.length?'<div class="info"><strong>Tenue</strong><div class="badges">'+outfits.map(o=>'<span class="badge">👗 '+esc(o)+'</span>').join('')+'</div></div>':'')+(e.notes?'<div class="info">📝 '+esc(e.notes)+'</div>':'')+'<div class="actions"><button class="secondary" onclick="detail.close()">Fermer</button></div></div>';
 $('detail').showModal();
}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$('today').onclick=()=>{view=new Date();view.setDate(1);render()};
$('type').onchange=render;
$('add').onclick=()=>{$('form').reset();document.querySelectorAll('input[name="outfit"]').forEach(x=>x.checked=false);$('customOutfit').style.display='none';$('dlg').showModal()};
$('specialOutfit').onchange=()=>{$('customOutfit').style.display=$('specialOutfit').checked?'block':'none'};
$('form').onsubmit=e=>{e.preventDefault();let outfits=[...document.querySelectorAll('input[name="outfit"]:checked')].map(x=>x.value);const custom=$('customOutfit').value.trim();if($('specialOutfit').checked&&custom){outfits=outfits.filter(x=>x!=='Tenue spéciale');outfits.push(custom)}events.push({id:crypto.randomUUID(),title:$('title').value,date:$('date').value,time:$('time').value,place:$('place').value,kind:$('kind').value,outfit:outfits,notes:$('notes').value});localStorage.setItem(KEY,JSON.stringify(events));render();$('dlg').close()};
$('ics').onclick=()=>{if(!events.length)return alert('Aucun événement à exporter.');const escics=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const body=events.map(e=>{let dt=e.date.replace(/-/g,'')+(e.time?('T'+e.time.replace(':','')+'00'):'T120000');return 'BEGIN:VEVENT\\r\\nDTSTART:'+dt+'\\r\\nSUMMARY:'+escics(e.title)+'\\r\\nLOCATION:'+escics(e.place)+'\\r\\nDESCRIPTION:'+escics(e.notes)+'\\r\\nEND:VEVENT'}).join('\\r\\n');const blob=new Blob(['BEGIN:VCALENDAR\\r\\nVERSION:2.0\\r\\nPRODID:-//Calendrier Majorettes//FR\\r\\n'+body+'\\r\\nEND:VCALENDAR'],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calendrier-majorettes.ics';a.click()};
render();
</script><dialog id="detail"></dialog></body>
